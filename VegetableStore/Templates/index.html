<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Овочева крамниця</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="/">🥕 Овочева крамниця</a>
            <span class="tagline">CRUD на ASP.NET</span>
        </div>
    </header>

    <main class="container">
        {{errors}}

        <section class="card">
            <h2>Додати овоч</h2>
            <form method="post" action="/vegetables" class="form-grid">
                {{antiforgery}}
                <label class="field">
                    <span>Назва</span>
                    <input name="name" value="{{name}}" placeholder="Напр., Tomato" required maxlength="50">
                </label>
                <label class="field">
                    <span>Тип</span>
                    <input name="type" value="{{type}}" placeholder="Напр., Vegetable" required maxlength="30">
                </label>
                <label class="field">
                    <span>Ціна, грн</span>
                    <input name="price" value="{{price}}" type="number" step="0.01" min="0" placeholder="0.00" required>
                </label>
                <button type="submit" class="btn btn-primary">Додати овоч</button>
            </form>
        </section>
        
        <section class="card">
            <div class="card-head">
                <h2>Усі овочі</h2>
                <span class="pill">{{count}}</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Назва</th>
                            <th>Тип</th>
                            <th class="num">Ціна</th>
                            <th class="actions">Дії</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{rows}}
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">Навчальний проєкт · ASP.NET Minimal API</div>
    </footer>
</body>
</html>
